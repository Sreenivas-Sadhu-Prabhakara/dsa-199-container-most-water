<text x="56.0" y="383.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">49 survives as the maximum through the remaining squeezes. The exchange argument</text>
